<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Agent Canvas</title>
<link rel="stylesheet" href="/xterm.css">
<style>
  :root { --bg: #0f1115; --s1: #171a21; --s2: #1f232c; --line: #2b303b; --text: #e8eaf0; --dim: #9aa3b5; --accent: #6f8cff; --ok: #4cc38a; --warn: #f2c230; --bad: #ef5350; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f7fa; --s1: #fff; --s2: #eef0f5; --line: #d8dce6; --text: #161a22; --dim: #5b6475; --accent: #3355e0; color-scheme: light; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); background: var(--s1); border-bottom: 1px solid var(--line); }
  header h1 { flex: 1; margin: 0; font-size: 17px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--ok); }
  nav { display: flex; background: var(--s1); border-bottom: 1px solid var(--line); }
  nav button { flex: 1; padding: 12px 6px; background: none; border: none; border-bottom: 3px solid transparent; color: var(--dim); font: inherit; font-size: 15px; }
  nav button[aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); }
  nav .badge { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 12px; }
  main { padding: 12px 16px 24px; max-width: 760px; margin: 0 auto; }
  .card { display: flex; align-items: center; gap: 12px; width: 100%; margin-bottom: 10px; padding: 14px; background: var(--s1); border: 1px solid var(--line); border-radius: 14px; color: inherit; text-align: left; font: inherit; }
  button.card { cursor: pointer; }
  .card .grow { flex: 1; min-width: 0; }
  .card b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card small, .dim { color: var(--dim); }
  .btn { padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--s2); color: var(--text); font: inherit; min-height: 44px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { border-color: var(--bad); color: var(--bad); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 18px 0 8px; }
  .term-wrap { background: #0d0f13; border-radius: 12px; padding: 6px; overflow: auto; max-height: 52vh; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .keys .btn { flex: none; min-width: 52px; padding: 8px 10px; min-height: 40px; }
  .bar { display: flex; gap: 8px; }
  .bar input { flex: 1; min-width: 0; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--s1); color: var(--text); font: inherit; }
  .act { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .act time { float: right; color: var(--dim); }
  .act.denied b { color: var(--bad); }
  pre.ask { white-space: pre-wrap; word-break: break-word; background: var(--s2); border-radius: 10px; padding: 10px; margin: 8px 0; font-size: 13px; }
  .center { text-align: center; padding: 48px 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><h1>Agent Canvas</h1><span id="dot" class="dot" title="Conexão"></span></header>

<section id="pair" class="center" hidden>
  <h2>Sem pareamento</h2>
  <p>Abra o app no computador, vá em <b>Configurações → Controle remoto</b> e escaneie o QR code com a câmera do celular.</p>
</section>

<section id="app" hidden>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="terms" aria-selected="true">Terminais</button>
    <button role="tab" data-tab="asks" aria-selected="false">Pedidos<span id="askbadge" class="badge" hidden>0</span></button>
    <button role="tab" data-tab="log" aria-selected="false">Atividade</button>
  </nav>
  <main>
    <div id="terms">
      <div id="list"></div>
      <button class="btn danger" id="stopall" style="width:100%;margin-top:8px">Interromper todos os agentes</button>
    </div>
    <div id="term" hidden>
      <div class="row" style="margin-bottom:10px"><button class="btn" id="back">← Terminais</button><button class="btn danger" id="stop1">Interromper</button></div>
      <b id="termname"></b>
      <div class="term-wrap"><div id="xt"></div></div>
      <div class="keys" id="keys"></div>
      <form class="bar" id="form"><input id="msg" autocomplete="off" autocapitalize="off" placeholder="Digite e envie" aria-label="Mensagem para o terminal"><button class="btn primary" type="submit">Enviar</button></form>
    </div>
    <div id="asks" hidden></div>
    <div id="log" hidden></div>
  </main>
</section>

<script src="/xterm.js"></script>
<script>
'use strict'
const $ = (id) => document.getElementById(id)
const KEY = 'ac_cred'
let cred = localStorage.getItem(KEY) || ''
let term = null, termId = null, abort = null

const rq = (path, opts = {}) => fetch(path, { ...opts, headers: { ...(opts.headers || {}), authorization: 'Bearer ' + cred, 'content-type': 'application/json' } }).then(async (r) => {
  if (r.status === 401) { localStorage.removeItem(KEY); cred = ''; show(); throw new Error('unauthorized') }
  return r
})
const post = (path, body) => rq(path, { method: 'POST', body: JSON.stringify(body || {}) })
const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); kids.forEach((k) => e.append(k)); return e }

function show() {
  $('pair').hidden = !!cred
  $('app').hidden = !cred
}

async function pairFromHash() {
  const m = /pair=([0-9a-f]+)/.exec(location.hash)
  if (!m) return
  history.replaceState(null, '', location.pathname) // the code must not stay in the address bar
  const name = (navigator.userAgentData?.platform || (/iPhone|iPad/.test(navigator.userAgent) ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android' : 'celular')) + ' ' + new Date().toLocaleDateString('pt-BR')
  const r = await fetch('/api/pair', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token: m[1], name }) })
  if (r.ok) { cred = (await r.json()).credential; localStorage.setItem(KEY, cred) }
  else $('pair').querySelector('p').textContent = 'Código inválido ou expirado. Gere outro no computador.'
}

// ---- terminal list
function renderTerms(list) {
  const box = $('list')
  box.replaceChildren(...(list.length ? list.map((t) => {
    const age = t.last ? Math.max(0, Math.round((Date.now() - t.last) / 1000)) : null
    const c = el('button', { className: 'card' }, el('span', { className: 'dot' + (age !== null && age < 6 ? ' on' : '') }), el('span', { className: 'grow' }, el('b', { textContent: t.name }), el('small', { textContent: `${t.wsName} · ${age === null ? 'sem saída' : age < 6 ? 'ativo' : 'parado há ' + (age < 90 ? age + ' s' : Math.round(age / 60) + ' min')}` })))
    c.onclick = () => openTerm(t)
    return c
  }) : [el('p', { className: 'dim', textContent: 'Nenhum terminal em execução. Abra um workspace no computador.' })]))
}

async function refresh() {
  try {
    const s = await (await rq('/api/state')).json()
    $('dot').classList.add('on')
    renderTerms(s.terminals)
    renderAsks(s.approvals)
    renderLog(s.activity)
  } catch { $('dot').classList.remove('on') }
}

// ---- terminal view
function closeTerm() {
  abort?.abort(); abort = null
  term?.dispose(); term = null; termId = null
  $('term').hidden = true; $('terms').hidden = false
}
async function openTerm(t) {
  closeTerm()
  termId = t.id
  $('termname').textContent = t.name
  $('terms').hidden = true; $('term').hidden = false
  const wrap = document.querySelector('.term-wrap')
  const cols = t.cols || 80, rows = t.rows || 24
  const fs = Math.max(6, Math.min(14, Math.floor((wrap.clientWidth - 12) / (cols * 0.6))))
  term = new Terminal({ cols, rows, fontSize: fs, disableStdin: true, scrollback: 2000, theme: { background: '#0d0f13' } })
  $('xt').replaceChildren()
  term.open($('xt'))
  abort = new AbortController()
  try {
    const r = await rq(`/api/term/${termId}/stream`, { signal: abort.signal })
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = ''
    for (;;) {
      const { done, value } = await reader.read()
      if (done) break
      buf += dec.decode(value, { stream: true })
      let i
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2)
        if (!line.startsWith('data: ')) continue
        const ev = JSON.parse(line.slice(6))
        if (ev.data) term?.write(Uint8Array.from(atob(ev.data), (c) => c.charCodeAt(0)))
      }
    }
  } catch {}
}
$('back').onclick = closeTerm
$('stop1').onclick = () => termId && post(`/api/term/${termId}/interrupt`)
$('form').onsubmit = (e) => { e.preventDefault(); const v = $('msg').value; if (!v || !termId) return; post(`/api/term/${termId}/input`, { data: v, enter: true }); $('msg').value = '' }
const KEYS = [['Enter', '\r'], ['Esc', '\x1b'], ['Tab', '\t'], ['↑', '\x1b[A'], ['↓', '\x1b[B'], ['←', '\x1b[D'], ['→', '\x1b[C'], ['Ctrl+C', '\x03']]
$('keys').append(...KEYS.map(([label, seq]) => { const b = el('button', { className: 'btn', textContent: label, type: 'button' }); b.onclick = () => termId && post(`/api/term/${termId}/input`, { data: seq }); return b }))
$('stopall').onclick = () => confirm('Interromper todos os agentes agora?') && post('/api/interrupt-all')

// ---- approvals + activity
function renderAsks(list) {
  const b = $('askbadge'); b.hidden = !list.length; b.textContent = list.length
  $('asks').replaceChildren(...(list.length ? list.map((r) => {
    const card = el('div', { className: 'card', style: 'display:block' },
      el('b', { textContent: `${r.from} → ${r.kind}` }),
      el('span', { className: 'dim', textContent: r.to ? `para ${r.to}` : '' }),
      r.text ? el('pre', { className: 'ask', textContent: r.text }) : '')
    const row = el('div', { className: 'row' })
    const deny = el('button', { className: 'btn danger', textContent: 'Negar' }); deny.onclick = () => post(`/api/approval/${r.id}`, { ok: false }).then(refresh)
    const allow = el('button', { className: 'btn primary', textContent: 'Permitir' }); allow.onclick = () => post(`/api/approval/${r.id}`, { ok: true }).then(refresh)
    row.append(deny, allow); card.append(row)
    return card
  }) : [el('p', { className: 'dim', textContent: 'Nenhum pedido pendente.' })]))
}
const KIND = { send: 'mensagem', ask: 'pergunta', spawn: 'criou agente', portal: 'navegador', done: 'concluiu', remote: 'celular', routine: 'rotina' }
function renderLog(list) {
  $('log').replaceChildren(...[...list].reverse().map((e) => {
    const d = el('div', { className: 'act' + (e.outcome === 'denied' ? ' denied' : '') })
    d.append(el('time', { textContent: new Date(e.t).toLocaleTimeString('pt-BR') }), el('b', { textContent: e.from }), ` ${KIND[e.kind] || e.kind}${e.to ? ' → ' + e.to : ''}`, e.text ? el('div', { className: 'dim', textContent: e.text }) : '')
    return d
  }))
}
$('tabs').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return
  for (const x of $('tabs').children) x.setAttribute('aria-selected', x === b)
  closeTerm() // restores the list; the panel switch below then hides what is not selected
  for (const id of ['terms', 'asks', 'log']) $(id).hidden = id !== b.dataset.tab
}

// live events: approvals and activity arrive without polling
async function events() {
  for (;;) {
    if (!cred) { await new Promise((r) => setTimeout(r, 1500)); continue }
    try {
      const r = await rq('/api/events'); const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = ''
      $('dot').classList.add('on')
      for (;;) {
        const { done, value } = await reader.read(); if (done) break
        buf += dec.decode(value, { stream: true })
        if (buf.includes('\n\n')) { buf = ''; refresh(); if (navigator.vibrate) navigator.vibrate(60) }
      }
    } catch {}
    $('dot').classList.remove('on')
    await new Promise((r) => setTimeout(r, 2000))
  }
}

;(async () => {
  await pairFromHash()
  show()
  if (cred) { refresh(); setInterval(refresh, 5000); events() }
})()
</script>
</body>
</html>
