<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2233"/>
      <stop offset="1" stop-color="#0b0d13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2c230" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f2c230" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- ropes: maestro -> agents (dashed, hanging like the canvas) -->
  <g fill="none" stroke="#9aa0ab" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 20">
    <path d="M256 236 C 210 290, 150 250, 120 150"/>
    <path d="M256 236 C 300 290, 360 250, 392 150"/>
    <path d="M256 236 C 270 330, 330 380, 396 372"/>
  </g>

  <!-- agent nodes -->
  <circle cx="120" cy="140" r="34" fill="#7c9cff"/>
  <circle cx="392" cy="140" r="34" fill="#4cc38a"/>
  <circle cx="400" cy="376" r="34" fill="#e8845c"/>
  <g fill="#0b0d13" fill-opacity="0.35">
    <circle cx="120" cy="140" r="14"/>
    <circle cx="392" cy="140" r="14"/>
    <circle cx="400" cy="376" r="14"/>
  </g>

  <!-- maestro node -->
  <circle cx="256" cy="236" r="110" fill="url(#glow)"/>
  <circle cx="256" cy="236" r="58" fill="#f2c230"/>
  <circle cx="256" cy="236" r="58" fill="none" stroke="#fff3c4" stroke-opacity="0.55" stroke-width="5"/>
  <circle cx="256" cy="236" r="22" fill="#2b2208" fill-opacity="0.35"/>

  <!-- baton (conductor's stick) -->
  <line x1="92" y1="436" x2="226" y2="294" stroke="#f4f5f8" stroke-width="16" stroke-linecap="round"/>
  <line x1="92" y1="436" x2="132" y2="394" stroke="#c9ced8" stroke-width="26" stroke-linecap="round"/>
</svg>
