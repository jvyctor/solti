# Push a tag like v0.8.0 (matching package.json): tests on Windows, macOS and Linux, then builds every installer and
# publishes a GitHub Release in this repository. The release notes are that version's section of CHANGELOG.md.
# No secrets needed: the workflow's own GITHUB_TOKEN can write releases here.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: CHANGELOG must have a section for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

  # Unit tests + smoke test on Windows, macOS and Linux (see ci.yml).
  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          printf '\n---\n**Download:** pick the file for your system below, or use the [download page](https://jvyctor.github.io/solti/). See the [install notes](https://github.com/jvyctor/solti#download) and the [Code signing policy](https://github.com/jvyctor/solti/blob/main/CODE_SIGNING.md).\n' >> notes.md
          cat notes.md
      - name: Create the release once (parallel uploads would race to create it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Solti ${GITHUB_REF_NAME#v}" --notes-file notes.md

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.args }} --publish always

  # Windows: build, sign through SignPath Foundation when it is configured (see CODE_SIGNING.md), rebuild the
  # auto-update files for the final installer, then upload. Without the SignPath settings the installer is
  # published unsigned, exactly as before.
  # Settings (Settings → Secrets and variables → Actions):
  #   secret   SIGNPATH_API_TOKEN
  #   variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
  windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Build the installer (not published yet)
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Upload the unsigned installer for SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: release/Solti-Setup-${{ steps.v.outputs.version }}.exe
          if-no-files-found: error
      - name: Sign with SignPath (needs manual approval in SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Use the signed installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: bash
        run: |
          f="Solti-Setup-${{ steps.v.outputs.version }}.exe"
          test -f "signed/$f"
          cp "signed/$f" "release/$f"
          powershell -NoProfile -Command "(Get-AuthenticodeSignature 'release/$f').Status"
      - name: Rebuild the auto-update files for the final installer
        run: node build/update-info.cjs release/Solti-Setup-${{ steps.v.outputs.version }}.exe ${{ steps.v.outputs.version }}
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f="release/Solti-Setup-${{ steps.v.outputs.version }}.exe"
          gh release upload "$GITHUB_REF_NAME" "$f" "$f.blockmap" release/latest.yml --clobber

  # Package managers, once every installer is in the release (hashes from GitHub, see build/package-managers.cjs):
  # Scoop bucket and Homebrew tap live in this repository, so they are committed to main here. winget and the AUR
  # are submitted only when their secrets exist:
  #   secret WINGET_TOKEN          classic PAT with public_repo (wingetcreate opens the PR in microsoft/winget-pkgs;
  #                                the very first version is submitted by hand, see packaging/README.md)
  #   secret AUR_SSH_PRIVATE_KEY   SSH key of the AUR account that owns solti-bin
  packages:
    needs: [build, windows]
    runs-on: ubuntu-latest
    env:
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write the manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build/package-managers.cjs "${GITHUB_REF_NAME#v}"
      - name: Commit the Scoop bucket and the Homebrew cask to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket Casks packaging
          git diff --cached --quiet || { git commit -m "Package manifests for ${GITHUB_REF_NAME}"; git push origin HEAD:main; }
      - name: Publish to the AUR
        if: ${{ env.AUR_KEY != '' }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$AUR_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/solti-bin.git aur
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO aur/
          cd aur
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "Update to ${GITHUB_REF_NAME#v}"
          git push origin HEAD:master

  winget:
    needs: [build, windows]
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit the new version to winget
        if: ${{ env.WINGET_TOKEN != '' }}
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update jvyctor.Solti --version $v --urls "https://github.com/jvyctor/solti/releases/download/v$v/Solti-Setup-$v.exe" --submit --token $env:WINGET_TOKEN
