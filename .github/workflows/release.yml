# Push a tag like v0.6.0 (matching package.json) to test, build for Windows, macOS and Linux, and publish to the public releases repo.
# One-time setup: add a repository secret RELEASES_TOKEN = a GitHub token with write access to
# jvyctor/agent-canvas-releases (fine-grained: Contents read/write).
name: Release
on:
  push:
    tags: ['v*']

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

  # Unit tests + smoke test on Windows, macOS and Linux (see ci.yml).
  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create the release once (parallel uploads would race to create it and fail with 422)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo jvyctor/agent-canvas-releases >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo jvyctor/agent-canvas-releases --title "${GITHUB_REF_NAME#v}" --notes "Agent Canvas ${GITHUB_REF_NAME#v}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis --x64
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: npx electron-builder ${{ matrix.args }} --publish always
