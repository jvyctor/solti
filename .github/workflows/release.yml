# Push a tag like v0.8.0 (matching package.json): tests on Windows, macOS and Linux, then builds every installer and
# publishes a GitHub Release in this repository. The release notes are that version's section of CHANGELOG.md.
# No secrets needed: the workflow's own GITHUB_TOKEN can write releases here.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: CHANGELOG must have a section for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

  # Unit tests + smoke test on Windows, macOS and Linux (see ci.yml).
  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          printf '\n---\n**Download:** pick the file for your system below, or use the [download page](https://jvyctor.github.io/agent-canvas/). Installers are not code-signed yet: see [install notes](https://github.com/jvyctor/agent-canvas#download).\n' >> notes.md
          cat notes.md
      - name: Create the release once (parallel uploads would race to create it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Agent Canvas ${GITHUB_REF_NAME#v}" --notes-file notes.md

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis --x64
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.args }} --publish always
